<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GameLingoPro webOS 26</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101a;color:white;font-family:Arial,sans-serif}#setup{position:absolute;z-index:10;left:3vw;top:3vh;max-width:690px;padding:24px;background:#111d2f;border:1px solid #32526b;border-radius:20px}h1{color:#52e3dc}p{line-height:1.4;color:#afbed1}input,button{padding:12px 15px;font-size:22px;border-radius:10px;margin:6px}input{background:#061523;color:white;border:1px solid #68859c}button{color:white;background:#156e79;border:none}#controls{position:fixed;top:2vh;right:2vw;z-index:20}#sub{position:absolute;bottom:6%;left:12%;right:12%;text-align:center;pointer-events:none}.glass{position:absolute;background:rgba(0,0,0,.82);border-radius:.5em;color:#fff;font-weight:600;line-height:1.25;max-width:44vw;font-size:clamp(18px,1.3vw,35px);padding:.4em .7em;pointer-events:none}#sub .glass{position:static;display:inline-block;font-size:clamp(20px,1.5vw,40px);max-width:100%}#hud{position:absolute;inset:0;pointer-events:none}.active #setup{display:none}
</style></head><body><section id="setup"><h1>GameLingoPro · webOS 26</h1><p>Telefon ve monitör aynı Wi-Fi ağında olmalı. GameLingoPro TV çeviri köprüsünü açın. IP ve 4 haneli kodu girin.</p><label>Telefon IP<input id="ip" placeholder="192.168.1.20"></label><label>Kod<input id="pin" maxlength="4" placeholder="0000"></label><button id="connect">Bağlan</button><p id="msg">Hazır</p><p>Bu sayfa kendi üzerinde çeviri gösterir; HDMI/PS5 görüntüsünün üstünde sistem katmanı oluşturmaz.</p></section><button id="controls">⚙</button><div id="hud"></div><div id="sub"></div><script>
(function(){'use strict';var ip=document.getElementById('ip'),pin=document.getElementById('pin'),hud=document.getElementById('hud'),sub=document.getElementById('sub'),msg=document.getElementById('msg'),gen=0,request=null;
try{ip.value=localStorage.getItem('glp_webos_ip')||location.hostname;pin.value=localStorage.getItem('glp_webos_pin')||''}catch(e){ip.value=location.hostname}
function stop(){gen++;if(request)request.abort();document.body.className='';hud.textContent='';sub.textContent=''}
function area(item){if(!item||typeof item.text!=='string'||!item.text.trim())return;var x=+item.x,y=+item.y,r=+item.right;if(!isFinite(x)||!isFinite(y)||!isFinite(r))return;var d=document.createElement('div');d.className='glass';d.textContent=item.text;d.style.top=(Math.max(0,Math.min(1,y))*100)+'%';if(item.side==='right')d.style.right=((1-Math.max(0,Math.min(1,r)))*100)+'%';else d.style.left=(Math.max(0,Math.min(1,x))*100)+'%';hud.appendChild(d)}
function display(data){hud.textContent='';(data.regions||[]).forEach(area);sub.textContent='';if(data.subtitle){var d=document.createElement('div');d.className='glass';d.textContent=data.subtitle;sub.appendChild(d)}document.body.className='active';msg.textContent='Bağlandı'}
function poll(id){if(id!==gen)return;var x=new XMLHttpRequest();request=x;x.open('GET','http://'+ip.value.trim()+':47323/subtitle?pin='+encodeURIComponent(pin.value.trim())+'&t='+Date.now(),true);x.timeout=2500;x.onload=function(){if(id!==gen)return;if(x.status===200){try{display(JSON.parse(x.responseText));setTimeout(function(){poll(id)},750)}catch(e){msg.textContent='Veri hatası';setTimeout(function(){poll(id)},1800)}}else{document.body.className='';msg.textContent=x.status===403?'Kod yanlış':'Bağlantı yok';setTimeout(function(){poll(id)},1800)}};x.onerror=x.ontimeout=function(){if(id===gen){document.body.className='';msg.textContent='Telefon erişilemiyor';setTimeout(function(){poll(id)},1800)}};x.send()}
document.getElementById('connect').onclick=function(){stop();var host=ip.value.trim();if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(host)||!/^\d{4}$/.test(pin.value.trim())){msg.textContent='IP ve 4 haneli kod gerekli';return}try{localStorage.setItem('glp_webos_ip',host);localStorage.setItem('glp_webos_pin',pin.value.trim())}catch(e){}msg.textContent='Bağlanıyor';poll(gen)};document.getElementById('controls').onclick=function(){document.body.className=''};
})();
</script></body></html>
