name: GameLingo Pro - Import and Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GameLingoPro-guncel-kaynak.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source ZIP safely
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          archive=pathlib.Path('GameLingoPro-guncel-kaynak.zip')
          if not archive.is_file(): raise SystemExit('Missing uploaded source ZIP')
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe path in ZIP: '+item.filename)
              z.extractall('.')
          PY
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GameLingoPro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
