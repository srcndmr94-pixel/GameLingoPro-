name: GameLingo Pro - Import and Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GameLingoPro-*.zip'
      - '.github/workflows/android.yml'
      - 'tools/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source ZIP safely
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          candidates = [pathlib.Path(n) for n in ('GameLingoPro-webOS-baglanti-onarimi.zip', 'GameLingoPro-webOS-bridge-kaynak.zip', 'GameLingoPro-pro-baglanti-duzeltmesi.zip', 'GameLingoPro-guncel-kaynak.zip')]
          archive=next((p for p in candidates if p.is_file()), None)
          print('Selected source archive:', archive)
          if archive is None: raise SystemExit('Missing uploaded source ZIP')
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe path in ZIP: '+item.filename)
              z.extractall('.')
          PY
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts
      - name: Apply GameLingo Pro interface changes
        run: python3 tools/apply_pro_brand.py
      - name: Add GameLingo Pro button audio feedback
        run: python3 tools/apply_pro_button_sounds.py
      - name: Verify sound controls and resources
        shell: bash
        run: |
          test -f app/src/main/java/com/example/altyazi/ProClickFeedback.kt
          test -f app/src/main/res/raw/pro_ui_click.wav
          test -f app/src/main/res/raw/pro_ui_confirm.wav
          grep -q 'cbProButtonSfx' app/src/main/res/layout/activity_main.xml
      - name: Apply animated GameLingoPro launch screen
        run: python3 tools/apply_pro_intro.py
      - name: Ensure no low-resolution intro photos are packaged
        shell: bash
        run: |
          for n in 1 2 3 4; do test ! -e app/src/main/res/drawable-nodpi/intro_phase$n.webp; done
          grep -q 'postInvalidateOnAnimation' app/src/main/java/com/example/altyazi/ProIntroActivity.kt
      - name: Verify animated launcher and intro audio
        shell: bash
        run: |
          test -f app/src/main/java/com/example/altyazi/ProIntroActivity.kt
          test -f app/src/main/res/raw/pro_intro_theme.wav
          grep -q 'ProIntroActivity' app/src/main/AndroidManifest.xml
          grep -q 'com.gamelingo.pro' app/build.gradle.kts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify Pro UI was applied
        run: |
          grep -q 'GAMELINGO PRO  •  BAĞLANTI MERKEZİ' app/src/main/res/layout/activity_main.xml
          grep -q 'android:text="GameLingo"' app/src/main/res/layout/activity_main.xml
          grep -q 'versionName = "GameLingoPro-1.0"' app/build.gradle.kts
          test -f app/src/main/res/drawable/pro_neon_panel.xml
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GameLingoPro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
