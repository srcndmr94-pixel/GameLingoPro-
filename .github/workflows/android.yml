name: GameLingo V6 foundation tests + APK

on:
  workflow_dispatch:
  push:
    branches: [v6-foundation]
    paths:
      - 'GameLingoPro-5.6.1-MapOCR-StayFix-Duzeltilmis-Kaynak.zip'
      - 'tools/gt563/**'
      - 'tools/apply_gt_original_563.py'
      - 'tools/gt564/**'
      - 'tools/apply_gt_original_564.py'
      - 'tools/apply_gt_original_565.py'
      - 'tools/apply_gt_original_566.py'
      - 'tools/apply_gt_original_567.py'
      - 'tools/apply_gt_original_568.py'
      - 'tools/gt568/**'
      - 'v6/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact corrected source
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path("GameLingoPro-5.6.1-MapOCR-StayFix-Duzeltilmis-Kaynak.zip")
          if not archive.is_file():
              raise SystemExit("Missing corrected source ZIP")
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit("Unsafe path: " + item.filename)
              z.extractall(".")
          PY
          test -f app/build.gradle.kts
          grep -q 'versionName = "GameLingoPro-5.6.1-MapOCR-StayFix"' app/build.gradle.kts
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts

      - name: Create side-by-side install variant (preserve old app)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle.kts")
          s=gradle.read_text()
          old='applicationId = "com.gamelingo.pro"'
          assert s.count(old) == 1, "Unexpected original application ID"
          gradle.write_text(s.replace(old,'applicationId = "com.gamelingo.pro.stayfix"',1))
          strings=Path("app/src/main/res/values/strings.xml")
          t=strings.read_text()
          assert '<string name="app_name">GameLingoPro</string>' in t
          strings.write_text(t.replace('<string name="app_name">GameLingoPro</string>', '<string name="app_name">GameLingoPro StayFix</string>'))
          # The UI-brand regression test must expect the variant's actual label.
          brand_test=Path("app/src/test/java/com/example/altyazi/GtBrandIdentity522Test.kt")
          content=brand_test.read_text()
          expected='assertTrue(strings.contains("<string name=\\\"app_name\\\">GameLingoPro</string>"))'
          updated='assertTrue(strings.contains("<string name=\\\"app_name\\\">GameLingoPro StayFix</string>"))'
          assert content.count(expected) == 1, "Expected brand-name assertion missing"
          brand_test.write_text(content.replace(expected, updated, 1))
          PY
          grep -q 'applicationId = "com.gamelingo.pro.stayfix"' app/build.gradle.kts


      - name: Import exact GameTranslator v1.8.49 upstream Android sources
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch v1.8.49 \
            https://gitlab.com/sefflex/GameTranslator.git gt-upstream
          git -C gt-upstream sparse-checkout set mobile/android/app/src/main/kotlin/com/gametranslator/gametranslator_mobile
          python3 tools/integrate_gt_original_v1849.py gt-upstream .
          test -f app/src/main/java/com/gametranslator/gametranslator_mobile/core/SubtitlePipeline.kt
          grep -q 'com.gamelingo.pro.gt1849' app/build.gradle.kts
          grep -q 'GameLingoPro-5.6.2-GTOriginal' app/build.gradle.kts

      - name: Apply GameLingo 5.6.3 original-engine OCR fixes
        run: |
          python3 tools/apply_gt_original_563.py
          test -f app/src/main/java/com/example/altyazi/GtOriginalInputGuard.kt
          test -f app/src/main/java/com/example/altyazi/GtOriginalQualityGuard.kt
          grep -q 'applicationId = "com.gamelingo.pro.gt1849.fix563"' app/build.gradle.kts

      - name: Apply 5.6.4 fast OCR and bounded original translation queue
        run: |
          python3 tools/apply_gt_original_564.py
          grep -q 'applicationId = "com.gamelingo.pro.gt1849.fast564"' app/build.gradle.kts
          grep -q 'GameLingoPro-5.6.4-GTFast' app/build.gradle.kts
          test -f app/src/main/java/com/example/altyazi/GtLatestFirstExecutor.kt
          test -f app/src/test/java/com/example/altyazi/GtRealtime564Test.kt

      - name: Apply 5.6.5 precise OCR rescan and latency logs
        run: |
          python3 tools/apply_gt_original_565.py
          grep -q 'versionName = "GameLingoPro-5.6.5-GTFastOCR"' app/build.gradle.kts
          test -f app/src/test/java/com/example/altyazi/GtRealtime565Test.kt

      - name: Apply 5.6.6 OCR confidence and early original-engine stabilization
        run: |
          python3 tools/apply_gt_original_566.py
          grep -q 'versionName = "GameLingoPro-5.6.6-GTStableFast"' app/build.gradle.kts
          test -f app/src/test/java/com/example/altyazi/GtRealtime566Test.kt

      - name: Apply 5.6.7 dialogue boundary and latency correlation fixes
        run: |
          python3 tools/apply_gt_original_567.py
          grep -q 'versionName = "GameLingoPro-5.6.7-GTDialogueFix"' app/build.gradle.kts
          test -f app/src/test/java/com/example/altyazi/GtRealtime567Test.kt

      - name: Apply 5.6.8 map OCR stability and idiom quality fixes
        run: |
          python3 tools/apply_gt_original_568.py
          grep -q 'versionName = "GameLingoPro-5.6.8-GTQuality"' app/build.gradle.kts
          test -f app/src/test/java/com/example/altyazi/GtRealtime568Test.kt

      - name: V6 foundation shadow quality boundaries and golden corpus
        run: |
          python3 v6/tools/apply_v6_foundation.py
          grep -q 'applicationId = "com.gamelingo.pro.v6test"' app/build.gradle.kts
          test -f app/src/test/resources/v6-caption-cases.tsv

      - name: Set monotonically increasing V6 test version
        run: |
          python3 - <<'PY'
          import os,pathlib
          gradle=pathlib.Path("app/build.gradle.kts")
          code=600000+int(os.environ["GITHUB_RUN_NUMBER"])
          s=gradle.read_text()
          assert "versionCode = 600001" in s and 'versionName = "6.0.0-alpha.1"' in s
          s=s.replace("versionCode = 600001",f"versionCode = {code}")
          s=s.replace('versionName = "6.0.0-alpha.1"',f'versionName = "6.0.0-alpha.{os.environ["GITHUB_RUN_NUMBER"]}"')
          gradle.write_text(s)
          print("GameLingo V6 test build",code)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore fixed V6 test-only signing key
        shell: bash
        run: |
          base64 --decode v6/signing/v6-debug.jks.b64 > app/debug.keystore
          echo '1685196779fd8026a5b4fd8fa9c0959978896ce6d7500f4c362a243e45f81e50  app/debug.keystore' | sha256sum -c -
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameLingo-V6-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run JVM regression tests (including V6 golden cases)
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Pack complete modified GameLingo source
        shell: bash
        if: success()
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('.')
          with zipfile.ZipFile('GameLingo-V6-Foundation-Kaynak.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for base in ('app/src', 'app/build.gradle.kts', 'settings.gradle.kts',
                           'build.gradle.kts', 'gradle.properties', 'tools/integrate_gt_original_v1849.py',
                           'tools/apply_gt_original_563.py', 'tools/gt563',
                           'tools/apply_gt_original_564.py', 'tools/gt564',
                           'tools/apply_gt_original_565.py', 'tools/apply_gt_original_566.py', 'tools/apply_gt_original_567.py',
                           'tools/apply_gt_original_568.py', 'tools/gt568', 'v6'):
                  p=root/base
                  for file in (p.rglob('*') if p.is_dir() else (p,)):
                      if file.is_file(): z.write(file, file.as_posix())
          PY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GameLingo-V6-Foundation-Kaynak
          path: GameLingo-V6-Foundation-Kaynak.zip
          if-no-files-found: error
