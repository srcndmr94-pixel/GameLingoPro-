name: GameLingoPro 5.6.1 MapOCR StayFix APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GameLingoPro-5.6.1-MapOCR-StayFix-Duzeltilmis-Kaynak.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact corrected source
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path("GameLingoPro-5.6.1-MapOCR-StayFix-Duzeltilmis-Kaynak.zip")
          if not archive.is_file():
              raise SystemExit("Missing corrected source ZIP")
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit("Unsafe path: " + item.filename)
              z.extractall(".")
          PY
          test -f app/build.gradle.kts
          grep -q 'versionName = "GameLingoPro-5.6.1-MapOCR-StayFix"' app/build.gradle.kts
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts

      - name: Create side-by-side install variant (preserve old app)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle.kts")
          s=gradle.read_text()
          old='applicationId = "com.gamelingo.pro"'
          assert s.count(old) == 1, "Unexpected original application ID"
          gradle.write_text(s.replace(old,'applicationId = "com.gamelingo.pro.stayfix"',1))
          strings=Path("app/src/main/res/values/strings.xml")
          t=strings.read_text()
          assert '<string name="app_name">GameLingoPro</string>' in t
          strings.write_text(t.replace('<string name="app_name">GameLingoPro</string>', '<string name="app_name">GameLingoPro StayFix</string>'))
          # The UI-brand regression test must expect the variant's actual label.
          brand_test=Path("app/src/test/java/com/example/altyazi/GtBrandIdentity522Test.kt")
          content=brand_test.read_text()
          expected='assertTrue(strings.contains("<string name=\\\"app_name\\\">GameLingoPro</string>"))'
          updated='assertTrue(strings.contains("<string name=\\\"app_name\\\">GameLingoPro StayFix</string>"))'
          assert content.count(expected) == 1, "Expected brand-name assertion missing"
          brand_test.write_text(content.replace(expected, updated, 1))
          PY
          grep -q 'applicationId = "com.gamelingo.pro.stayfix"' app/build.gradle.kts


      - name: Import exact GameTranslator v1.8.49 upstream Android sources
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch v1.8.49 \
            https://gitlab.com/sefflex/GameTranslator.git gt-upstream
          git -C gt-upstream sparse-checkout set mobile/android/app/src/main/kotlin/com/gametranslator/gametranslator_mobile
          python3 tools/integrate_gt_original_v1849.py gt-upstream .
          test -f app/src/main/java/com/gametranslator/gametranslator_mobile/core/SubtitlePipeline.kt
          grep -q 'com.gamelingo.pro.gt1849' app/build.gradle.kts
          grep -q 'GameLingoPro-5.6.2-GTOriginal' app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate standalone debug signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt -keystore app/debug.keystore -storetype JKS \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GameLingoPro Debug,O=Android,C=US"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameLingoPro-5.6.1-MapOCR-StayFix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run JVM regression tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Pack complete modified GameLingo source
        shell: bash
        if: success()
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('.')
          with zipfile.ZipFile('GameLingoPro-5.6.2-GTOriginal-Kaynak.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for base in ('app/src', 'app/build.gradle.kts', 'settings.gradle.kts',
                           'build.gradle.kts', 'gradle.properties', 'tools/integrate_gt_original_v1849.py'):
                  p=root/base
                  for file in (p.rglob('*') if p.is_dir() else (p,)):
                      if file.is_file(): z.write(file, file.as_posix())
          PY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GameLingoPro-5.6.2-GTOriginal-Kaynak
          path: GameLingoPro-5.6.2-GTOriginal-Kaynak.zip
          if-no-files-found: error
