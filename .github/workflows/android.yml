name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify Android project files
        run: |
          test -f settings.gradle.kts || { echo "Missing Android source: settings.gradle.kts"; exit 1; }
          test -f app/build.gradle.kts || { echo "Missing Android source: app/build.gradle.kts"; exit 1; }
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GameLingoPro-debug
          path: app/build/outputs/apk/debug/*.apk
