name: GameLingoPro 5.6.1 MapOCR StayFix APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GameLingoPro-5.6.1-MapOCR-StayFix-Duzeltilmis-Kaynak.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact corrected source
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path("GameLingoPro-5.6.1-MapOCR-StayFix-Duzeltilmis-Kaynak.zip")
          if not archive.is_file():
              raise SystemExit("Missing corrected source ZIP")
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit("Unsafe path: " + item.filename)
              z.extractall(".")
          PY
          test -f app/build.gradle.kts
          grep -q 'versionName = "GameLingoPro-5.6.1-MapOCR-StayFix"' app/build.gradle.kts
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate standalone debug signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt -keystore app/debug.keystore -storetype JKS \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GameLingoPro Debug,O=Android,C=US"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameLingoPro-5.6.1-MapOCR-StayFix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run JVM regression tests
        run: gradle :app:testDebugUnitTest --no-daemon
