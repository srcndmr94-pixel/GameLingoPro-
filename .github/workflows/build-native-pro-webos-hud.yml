name: GameLingoPro - Original Android + webOS HUD
on:
  push:
    branches: [main, feature/native-app-webos-hud, feature/menu-sticky-overlay]
    paths:
      - '.github/workflows/build-native-pro-webos-hud.yml'
      - 'tools/apply_native_gamelingopro_webos_hud.py'
      - 'tools/apply_native_pro_translation_quality.py'
      - 'tools/apply_pro_hud_cards_fix.py'
      - 'tools/apply_pro_subtitle_flow_23.py'
      - 'tools/apply_pro_long_subtitle_24.py'
      - 'tools/GameLingoPro-2.5-Source-Patch.zip'
      - 'tools/apply_pro_ocr_reliability_26.py'
      - 'tools/ProSubtitleAssembler.kt'
      - 'tools/ProHudCards.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract original GameLingoPro sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          z=Path("GameLingoPro-webOS-baglanti-onarimi.zip")
          if not z.is_file():raise SystemExit("Genuine GameLingoPro source archive missing")
          with ZipFile(z) as archive:
              for item in archive.namelist():
                  p=PurePosixPath(item)
                  if p.is_absolute() or ".." in p.parts:raise SystemExit("Unsafe source zip path: "+item)
              archive.extractall(".")
          PY
          test -f app/src/main/java/com/example/altyazi/CaptureService.kt
          test -f app/src/main/java/com/example/altyazi/PhoneBridge.kt
          test -f app/src/main/java/com/example/altyazi/MainActivity.kt
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts
      - name: Inspect menu overlay lifecycle for sticky menu fix
        shell: bash
        run: |
          echo '=== Menu key and OCR ==='
          grep -n -C 23 'lastMenuKey' app/src/main/java/com/example/altyazi/CaptureService.kt | head -n 210
          echo '=== Overlay label manager ==='
          grep -n -A 100 -B 20 'fun setLabels' app/src/main/java/com/example/altyazi/Overlay.kt | head -n 180
          echo '=== Overlay label expiry ==='
          grep -n -A 60 -B 10 'fun clearLabels' app/src/main/java/com/example/altyazi/Overlay.kt | head -n 110
          echo '=== Settings XML ==='
          grep -n -C 8 'ayarMenu' app/src/main/res/layout/activity_main.xml | head -n 70
      - name: Preserve Pro colors and settings layout
        run: python3 tools/apply_pro_brand.py
      - name: Install optional neon button sounds
        run: python3 tools/apply_pro_button_sounds.py
      - name: Install vector neon splash and original audio
        run: python3 tools/apply_pro_intro.py
      - name: Preserve and group existing Pro settings
        run: python3 tools/apply_pro_settings_map.py
      - name: Integrate original GameLingoPro OCR with mobile to LG HUD bridge
        run: python3 tools/apply_native_gamelingopro_webos_hud.py .
      - name: Repair original GameLingoPro OCR and natural-language quality
        run: python3 tools/apply_native_pro_translation_quality.py .
      - name: Fix left mission and right bottom reward cards
        run: python3 tools/apply_pro_hud_cards_fix.py .
      - name: Fix continued subtitle OCR and compact phone layout
        run: python3 tools/apply_pro_subtitle_flow_23.py .
      - name: Fix long source captions and remove output clipping
        run: python3 tools/apply_pro_long_subtitle_24.py .
      - name: Apply GameLingoPro 2.5 OCR stabilization and unit tests
        shell: bash
        run: |
          mkdir -p /tmp/glp25
          python3 -m zipfile -e tools/GameLingoPro-2.5-Source-Patch.zip /tmp/glp25
          python3 /tmp/glp25/apply_gamelingopro_25_stable_ocr.py .
          mkdir -p app/src/test/java/com/example/altyazi
          cp /tmp/glp25/ProSubtitleAssembler25Test.kt app/src/test/java/com/example/altyazi/
          python3 - <<'PY'
          from pathlib import Path
          build=Path("app/build.gradle.kts")
          s=build.read_text(encoding="utf-8")
          assert 'applicationId = "com.gamelingo.pro"' in s
          assert 'dependencies {' in s
          if 'testImplementation("junit:junit:4.13.2")' not in s:
              s=s.replace('dependencies {', 'dependencies {\n    testImplementation("junit:junit:4.13.2")', 1)
          build.write_text(s,encoding="utf-8")
          PY
          test -f app/src/test/java/com/example/altyazi/ProSubtitleAssembler25Test.kt
          grep -q 'expanded.recycle()' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'versionCode = 20261126' app/build.gradle.kts
      - name: Repair 2.5 OCR regressions using original GameLingoPro sources
        run: |
          python3 tools/apply_pro_ocr_reliability_26.py .
          grep -q 'GameLingoPro-2.6-OCR-Flow' app/build.gradle.kts
          grep -q 'ESKİ İSTEK HAFIZAYA ALINDI' app/src/main/java/com/example/altyazi/CaptureService.kt
          test -f app/src/test/java/com/example/altyazi/ProSubtitleFlowTest.kt
      - name: Verify full-subtitle OCR patch and original GameLingoPro ID
        run: |
          grep -q 'ProSubtitleAssembler.fuller' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'candidateStartedAtMs' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 't.maxLines = Int.MAX_VALUE' app/src/main/java/com/example/altyazi/Overlay.kt
          grep -q 'versionCode = 20261127' app/build.gradle.kts
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts
      - name: Verify repaired OCR continuation and translation quality
        run: |
          grep -q 'meaningfulExpansion' app/src/main/java/com/example/altyazi/ProTranscriptGuard.kt
          grep -q 'gapFactor' app/src/main/java/com/example/altyazi/OfflineFix.kt
          grep -q 'serve as a medium' app/src/main/java/com/example/altyazi/TranslationQualityGate.kt
          grep -q 'versionCode = 20261127' app/build.gradle.kts
      - name: Verify grouped HUD cards and original Android app
        run: |
          grep -q 'ProHudCards.group' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'ProHudCards.rightBottom' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'Color.argb(249,25,29,43)' app/src/main/java/com/example/altyazi/Overlay.kt
          test -f app/src/main/java/com/example/altyazi/ProHudCards.kt
      - name: Verify source-aware dialogue and idiom guards
        shell: bash
        run: |
          grep -q 'ProTranscriptGuard.speakersCompatible' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'ProTranscriptGuard.separateObjective' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'ProTranscriptGuard.literalIdiom' app/src/main/java/com/example/altyazi/TranslationQualityGate.kt
          grep -q 'versionCode = 20261127' app/build.gradle.kts
      - name: Verify Pro native identity and spatial translation hooks
        shell: bash
        run: |
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts
          grep -q 'versionCode = 20261127' app/build.gradle.kts
          grep -q 'PhoneBridgeService.publishHud' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'class PhoneBridgeService' app/src/main/java/com/example/altyazi/PhoneBridge.kt
          grep -q 'region' webos/index.html
          grep -q 'service/webos-external' webos/index.html
          grep -q 'ProIntroActivity' app/src/main/AndroidManifest.xml
          node --version
          python3 - <<'PY'
          from pathlib import Path
          s=Path("webos/index.html").read_text()
          Path("/tmp/glp-webos-check.js").write_text(s.split("<script>")[1].split("</script>")[0])
          PY
          node --check /tmp/glp-webos-check.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Execute JUnit OCR regression tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Compile GameLingoPro Android debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify signed APK and package identity
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "Android APK size:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -print -quit)"
          test -n "$signer"
          "$signer" verify app/build/outputs/apk/debug/app-debug.apk
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts
      - name: Package matching GameLingoPro webOS receiver
        shell: bash
        run: |
          mkdir -p dist/ipk/data/usr/palm/applications/com.gamelingo.pro.webos dist/ipk/control
          cp webos/index.html webos/appinfo.json dist/ipk/data/usr/palm/applications/com.gamelingo.pro.webos/
          printf 'Package: com.gamelingo.pro.webos\nVersion: 1.1.0\nArchitecture: all\nMaintainer: GameLingoPro\nDescription: GameLingoPro webOS HUD receiver\n' > dist/ipk/control/control
          printf '2.0\n' > dist/ipk/debian-binary
          tar -czf dist/ipk/control.tar.gz -C dist/ipk/control .
          tar -czf dist/ipk/data.tar.gz -C dist/ipk/data .
          cd dist/ipk
          ar q ../GameLingoPro-webOS-HUD-1.1.0.ipk debian-binary control.tar.gz data.tar.gz
          ar t ../GameLingoPro-webOS-HUD-1.1.0.ipk
          cd ../..
          cp app/build/outputs/apk/debug/app-debug.apk dist/GameLingoPro-Android-OCR23-SubtitleFlow-debug.apk
      - name: Ensure deliverables were both created
        run: |
          test -s dist/GameLingoPro-Android-OCR23-SubtitleFlow-debug.apk
          test -s dist/GameLingoPro-webOS-HUD-1.1.0.ipk
      - name: Upload native GameLingoPro APK and webOS IPK
        uses: actions/upload-artifact@v4
        with:
          name: GameLingoPro-Original-App-OCR23
          path: |
            dist/GameLingoPro-Android-OCR23-SubtitleFlow-debug.apk
            dist/GameLingoPro-webOS-HUD-1.1.0.ipk
          if-no-files-found: error
