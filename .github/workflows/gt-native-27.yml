name: GameLingoPro Native GT Engine and Subtitle Style
on:
  push:
    branches: [feature/gt-exact-only-overlay]
    paths:
      - '.github/workflows/gt-native-27.yml'
      - 'tools/apply_gt_v27_engine.py'
      - 'tools/apply_gt_v27_subtitle_style.py'
      - 'tools/apply_gt_v28_all_hud.py'
      - 'tools/apply_gt_v29_adjustable_style.py'
      - 'tools/apply_gt_v291_size_fix.py'
      - 'tools/gt_v30_patch.zlib.b64'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract original GameLingoPro Kotlin sources
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          with ZipFile('GameLingoPro-webOS-baglanti-onarimi.zip') as z:
              for item in z.namelist():
                  p=PurePosixPath(item)
                  if p.is_absolute() or '..' in p.parts:raise SystemExit('Unsafe ZIP')
              z.extractall('.')
          PY
          test -f app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts
      - name: Preserve original GameLingoPro UI and spatial HUD
        run: |
          python3 tools/apply_pro_brand.py
          python3 tools/apply_pro_button_sounds.py
          python3 tools/apply_pro_intro.py
          python3 tools/apply_pro_settings_map.py
          python3 tools/apply_native_gamelingopro_webos_hud.py .
          python3 tools/apply_native_pro_translation_quality.py .
          python3 tools/apply_pro_hud_cards_fix.py .
          python3 tools/apply_pro_subtitle_flow_23.py .
          python3 tools/apply_pro_long_subtitle_24.py .
      - name: Preserve 2.5 and 2.6 OCR improvements
        run: |
          mkdir -p /tmp/glp25
          python3 -m zipfile -e tools/GameLingoPro-2.5-Source-Patch.zip /tmp/glp25
          python3 /tmp/glp25/apply_gamelingopro_25_stable_ocr.py .
          mkdir -p app/src/test/java/com/example/altyazi
          cp /tmp/glp25/ProSubtitleAssembler25Test.kt app/src/test/java/com/example/altyazi/
          python3 tools/apply_pro_ocr_reliability_26.py .
      - name: Retrieve GameTranslator 1.8.49 Android sources
        run: git clone --quiet --depth 1 --branch v1.8.49 https://gitlab.com/sefflex/GameTranslator.git /tmp/GameTranslator
      - name: Replace active translation chain with GameTranslator
        run: python3 tools/apply_gt_v27_engine.py . /tmp/GameTranslator
      - name: Apply GameTranslator subtitle appearance
        run: python3 tools/apply_gt_v27_subtitle_style.py .
      - name: Enable GameTranslator-style all-screen game HUD
        run: python3 tools/apply_gt_v28_all_hud.py .
      - name: Replace legacy visual overrides with adjustable GT glass renderer
        run: python3 tools/apply_gt_v29_adjustable_style.py .
      - name: Ensure requested 28sp is not overridden in rendering
        run: python3 tools/apply_gt_v291_size_fix.py .
      - name: Replace legacy yellow subtitle renderer with GameTranslator exact-source styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib
          payload=Path('tools/gt_v30_patch.zlib.b64').read_text().strip()
          decoded=zlib.decompress(base64.b64decode(payload))
          assert b'GameTranslator GT exact visual renderer installed' in decoded
          Path('/tmp/apply_gt_exact_renderer_v30.py').write_bytes(decoded)
          PY
          python3 /tmp/apply_gt_exact_renderer_v30.py .
          # Remove two malformed test expectations; renderer/source checks remain.
          sed -i '/assertTrue(prefs.contains(".putInt(/d' app/src/test/java/com/example/altyazi/GtExactOverlayTest.kt
      - name: Verify GT-only renderer, original package and independent HUD
        run: |
          grep -q 'overlay = GtExactOverlay(this)' app/src/main/java/com/example/altyazi/CaptureService.kt
          ! grep -q 'overlay = Overlay(this)' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'shape(184,10)' app/src/main/java/com/example/altyazi/GtExactOverlay.kt
          grep -q 'shape(247,6)' app/src/main/java/com/example/altyazi/GtExactOverlay.kt
          grep -q 'GtAllHud.group' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts
          test -f app/src/test/java/com/example/altyazi/GtExactOverlayTest.kt
      - name: Verify GT default subtitle size and one active renderer
        run: |
          grep -q 'GameLingoPro-3.0-GT-ExactOverlay' app/build.gradle.kts
          grep -q 'subtitleStyle(target)' app/src/main/java/com/example/altyazi/GtExactOverlay.kt
          test -f app/src/test/java/com/example/altyazi/GtRenderedSizeTest.kt
      - name: Verify selected subtitle settings control all rendered areas
        run: |
          grep -q 'GameLingoPro-3.0-GT-ExactOverlay' app/build.gradle.kts
          grep -q 't.setTextColor(stil.yaziRengi)' app/src/main/java/com/example/altyazi/Overlay.kt
          grep -q 'lastGTStyle' app/src/main/java/com/example/altyazi/CaptureService.kt
          test -f app/src/test/java/com/example/altyazi/GtActualAppearanceTest.kt
      - name: Verify all HUD zones, source grouping and Pro identity
        run: |
          grep -q 'GtAllHud.group' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'gtMultiHudV28Configured' app/src/main/java/com/example/altyazi/Prefs.kt
          grep -q 'GameLingoPro-3.0-GT-ExactOverlay' app/build.gradle.kts
          grep -q 'PhoneBridgeService.publishHud' app/src/main/java/com/example/altyazi/CaptureService.kt
          test -f app/src/test/java/com/example/altyazi/GtAllHudTest.kt
      - name: Verify original identity and new caption style
        run: |
          grep -q 'applicationId = "com.gamelingo.pro"' app/build.gradle.kts
          grep -q 'GameLingoPro-3.0-GT-ExactOverlay' app/build.gradle.kts
          grep -q 'GtNativeEngine.translate(source, fast)' app/src/main/java/com/example/altyazi/CaptureService.kt
          grep -q 'Color.red(stil.arkaRenk)' app/src/main/java/com/example/altyazi/Overlay.kt
          grep -q 't.maxLines = Int.MAX_VALUE' app/src/main/java/com/example/altyazi/Overlay.kt
          test -f app/src/main/assets/GameTranslator-LICENSE.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run OCR and GameTranslator engine unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile original native GameLingoPro APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK identity and signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -print -quit)"
          test -n "$signer"
          "$signer" verify app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameLingoPro-3.0-GT-OnlyOverlay
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
